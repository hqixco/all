<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ОВАЛТУН - Готовые дизайн-проекты</title>
    <script type="module" src="/src/js/main.js"></script>
  </head>
  <body class="page page--design-projects">
    <div data-include="/partials/header.html"></div>

    <main class="design-projects-page">
      <div class="container container--narrow">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
          <a class="breadcrumbs__link" href="/">Главная</a>
          <span class="breadcrumbs__separator" aria-hidden="true">-</span>
          <span class="breadcrumbs__current">Готовые дизайн-проекты</span>
        </nav>

        <h1 class="design-projects-page__title">Готовые дизайн-проекты</h1>

        <section class="design-projects-cta" aria-label="Получите дизайн-проект">
          <div class="design-projects-cta__content">
            <h2 class="design-projects-cta__title">Получите дизайн-проект</h2>
            <p class="design-projects-cta__text">Получайте актуальные скидки и новости</p>
          </div>

          <a class="design-projects-cta__button" href="#">Заказать дизайн-проект</a>
        </section>

        <section class="design-projects-gallery" aria-label="Готовые дизайн-проекты">
          <div class="design-projects-gallery__row design-projects-gallery__row--top">
            <div class="design-projects-gallery__column design-projects-gallery__column--single">
              <a class="design-project-card design-project-card--image" href="#" aria-label="Керамогранит Bari синий" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-1.jpg" alt="" aria-hidden="true" />
              </a>
            </div>

            <div class="design-projects-gallery__column design-projects-gallery__column--stacked">
              <a class="design-project-card design-project-card--bath" href="#" aria-label="Светлая ванная комната" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-2.jpg" alt="" aria-hidden="true" />
              </a>
              <a class="design-project-card design-project-card--gray" href="#" aria-label="Мрамор и камень" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-3.jpg" alt="" aria-hidden="true" />
              </a>
            </div>

            <div class="design-projects-gallery__column design-projects-gallery__column--single">
              <a class="design-project-card design-project-card--floor" href="#" aria-label="Напольные покрытия" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-4.jpg" alt="" aria-hidden="true" />
              </a>
            </div>

            <div class="design-projects-gallery__column design-projects-gallery__column--stacked">
              <a class="design-project-card design-project-card--wood" href="#" aria-label="Деревянные фактуры" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-5.jpg" alt="" aria-hidden="true" />
              </a>
              <a class="design-project-card design-project-card--gray" href="#" aria-label="Минимализм в сером" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-6.jpg" alt="" aria-hidden="true" />
              </a>
            </div>
          </div>

          <div class="design-projects-gallery__row design-projects-gallery__row--bottom">
            <div class="design-projects-gallery__column design-projects-gallery__column--stacked">
              <a class="design-project-card design-project-card--bath" href="#" aria-label="Светлый санузел" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-7.jpg" alt="" aria-hidden="true" />
              </a>
              <a class="design-project-card design-project-card--blue" href="#" aria-label="Проект Bari blue" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-8.jpg" alt="" aria-hidden="true" />
              </a>
            </div>

            <div class="design-projects-gallery__column design-projects-gallery__column--single">
              <a class="design-project-card design-project-card--floor" href="#" aria-label="Тёмный пол" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-9.jpg" alt="" aria-hidden="true" />
              </a>
            </div>

            <div class="design-projects-gallery__column design-projects-gallery__column--stacked">
              <a class="design-project-card design-project-card--wood" href="#" aria-label="Тёплое дерево" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-10.jpg" alt="" aria-hidden="true" />
              </a>
              <a class="design-project-card design-project-card--gray" href="#" aria-label="Серый интерьер" data-modal-open="#site-modal">
                <img class="design-project-card__image" src="/images/design-projects-gallery-11.jpg" alt="" aria-hidden="true" />
              </a>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div data-include="/partials/footer.html"></div>
    <div data-include="/partials/modal.html"></div>
  </body>
</html>
