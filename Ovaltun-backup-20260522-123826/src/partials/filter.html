<aside class="filter" data-accordion data-filter>
  <div class="filter__mobile-head">
    <p class="filter__title">Фильтр</p>
    <button class="filter__close" type="button" data-filter-close aria-label="Закрыть фильтр">×</button>

      <span class="filter__group-icon" aria-hidden="true"><img class="filter__group-icon-image" src="/images/filter-chevron.svg" alt="" /></span>

    <div class="filter__group-content">
      <label class="filter__checkbox"><input type="checkbox" /> Керамогранит</label>
      <label class="filter__checkbox"><input type="checkbox" /> Плитка</label>

  </div>

      <span class="filter__group-icon" aria-hidden="true"><img class="filter__group-icon-image" src="/images/filter-chevron.svg" alt="" /></span>
    </button>
    <div class="filter__group-content">
      <label class="filter__checkbox"><input type="checkbox" /> GRS</label>
      <label class="filter__checkbox"><input type="checkbox" /> Quartz</label>
      <label class="filter__checkbox"><input type="checkbox" /> Classic</label>
    </div>
  </div>

      <label class="filter__checkbox"><input type="checkbox" /> Малый формат</label>
