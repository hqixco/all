<div class="quantity-stepper" data-quantity-stepper>
  <button class="quantity-stepper__button" type="button" data-quantity-plus aria-label="Увеличить количество">
    <img class="quantity-stepper__icon" src="/images/add-round-light.svg" alt="" aria-hidden="true" />
  </button>
  <input class="quantity-stepper__input" type="number" min="1" value="1" data-quantity-input />
  <button class="quantity-stepper__button" type="button" data-quantity-minus aria-label="Уменьшить количество">
    <img class="quantity-stepper__icon" src="/images/remove-round-light.svg" alt="" aria-hidden="true" />
  </button>
</div>
