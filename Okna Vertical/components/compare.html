<section class="compare-section" id="{{id}}" data-component="compare">
  <div class="compare-container">
    <div class="compare-visual"><img src="/assets/compare-visual.png" alt="Пример подробного расчёта окон"></div>
    <div class="compare-content">
      <div class="compare-copy">
        <div class="compare-copy__visual" aria-hidden="true"><img src="/assets/compare-visual.png" alt=""></div>
        <h2>{{title}}</h2>
        <p>{{lead}}</p>
        <ul class="compare-list">{{#items}}<li>{{text}}</li>{{/items}}</ul>
      </div>
      <form class="compare-action" id="{{formId}}" enctype="multipart/form-data">
        <input type="hidden" name="source" value="Проверка сметы">
        <div class="compare-form-fields">
          <label class="compare-field"><span>Телефон</span><span class="contact-method-combo"><input type="tel" name="phone" autocomplete="tel" placeholder="+7 (___) ___-__-__" required><select class="contact-method-select" name="contact_method" aria-label="Способ связи"><option value="Телефон">По телефону</option><option value="Telegram">Telegram</option><option value="MAX">MAX</option><option value="SMS">SMS</option></select></span></label>
          <label class="compare-file"><span>Загрузить расчёт</span><input type="file" name="estimate" accept=".pdf,.xls,.xlsx,.jpg,.jpeg,.png"><strong>Выбрать файл</strong></label>
        </div>
        <button class="button button--red" type="submit">Проверить расчёт бесплатно <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg></button>
        <label class="compare-policy"><input type="checkbox" name="policy" required><span>Ознакомлен и согласен с условиями <a href="/politika-konfidentsialnosti/">политики конфиденциальности</a></span></label>
        <p class="compare-form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
