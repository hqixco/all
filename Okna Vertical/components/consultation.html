<section class="home-faq home-page consultation-section" id="{{id}}" data-component="consultation"><div class="home-wrap"><h2>{{titleHtml}}</h2><p class="home-section-lead">{{leadHtml}}</p><form class="home-lead-form consultation-form" action="/mail.php" method="post" enctype="multipart/form-data"><input type="hidden" name="source_name" value="{{sourceName}}"><label>Телефон<input name="phone" type="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" required></label>{{#blinds}}<label>Способ связи<select name="contact_method"><option value="Телефон">По телефону</option><option value="Telegram">Telegram</option><option value="MAX">MAX</option><option value="SMS">SMS</option></select></label><label>Система<select name="system"><option value="Нужна консультация">Помогите выбрать</option><option>Рулонные шторы</option><option>День-Ночь</option><option>Горизонтальные жалюзи</option><option>Вертикальные жалюзи</option></select></label><label>Фото окна (необязательно)<input type="file" name="photo" accept="image/*"></label>{{/blinds}}<label>Что нужно рассчитать?<textarea name="comment" rows="3" placeholder="{{commentPlaceholder}}"></textarea></label><label class="home-consent"><input type="checkbox" name="policy" required><span>Соглашаюсь с <a href="/politika-konfidentsialnosti/">политикой конфиденциальности</a></span></label><button class="home-button" type="submit">Получить расчёт<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button><p class="home-form-status" aria-live="polite"></p></form></div></section>
