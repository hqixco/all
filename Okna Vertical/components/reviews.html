            <p>
              Реальные впечатления клиентов о замере, изготовлении, монтаже и
              результате работы нашей команды.
            </p>
            <div class="reviews-heading__note">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 20 6v6c0 4.8-3.1 8.1-8 10-4.9-1.9-8-5.2-8-10V6l8-3Z"></path>

          </div>
          <div class="review-grid">

          </div>

            <a class="reviews-platform-button reviews-platform-button--vk" href="https://vk.com/vertyar" target="_blank" rel="noopener noreferrer"><span>Отзывы ВКонтакте</span> <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"></path></svg></a>
          </div>
