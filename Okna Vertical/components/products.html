<section class="home-products home-page" id="{{id}}" data-component="products"><div class="home-wrap"><h2>{{{titleHtml}}}</h2><p class="home-section-lead">{{{leadHtml}}}</p><div class="home-product-grid">{{#items}}<article class="home-product-card">{{#showImage}}<div class="home-product-card__visual"><img src="{{imageSrc}}" width="{{imageWidth}}" height="{{imageHeight}}" alt="{{imageAlt}}" loading="lazy">{{#showBrand}}<img class="home-product-card__veka" src="/assets/veka-logo.png" alt="VEKA">{{/showBrand}}</div>{{/showImage}}<div class="home-product-card__content"><span>{{{kickerHtml}}}</span><h3>{{{titleHtml}}}</h3><p>{{{descriptionHtml}}}</p><dl>{{#features}}<div><dt>{{{labelHtml}}}</dt><dd>{{{valueHtml}}}</dd></div>{{/features}}</dl><strong>{{{priceHtml}}}</strong><button class="home-product-card__button" type="button" data-package-title="{{modalTitle}}" data-package-modal-title="{{modalHeading}}" data-package-description="{{modalDescription}}" data-package-image="{{modalImage}}" data-package-submit="{{modalSubmit}}"{{#photoUpload}} data-package-upload="photo"{{/photoUpload}}{{#noImage}} data-package-no-image="true"{{/noImage}}>{{{buttonLabelHtml}}}</button></div></article>{{/items}}</div></div></section>
